<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Sun Rays Circle -->
  <circle cx="24" cy="24" r="22" fill="#FEF3C7" opacity="0.6"/>
  <circle cx="24" cy="24" r="18" fill="url(#sunGrad)" filter="url(#glow)"/>

  <!-- Wallet Body -->
  <rect x="11" y="15" width="26" height="19" rx="4" fill="url(#walletGrad)"/>
  
  <!-- Wallet Flap & Accent -->
